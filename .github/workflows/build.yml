name: Builds
on:
  push:
    branches:
      - '**'

jobs:
  inspect:
    runs-on: windows-11-arm
    steps:
      - name: Inspect cpu features
        run: |
          curl -LO https://martin.st/temp/winpf2.exe
          curl -LO https://martin.st/temp/cpuname-aarch64.exe
          curl -LO https://martin.st/temp/pac-test/pac-test.exe
          ./winpf2.exe
          ./cpuname-aarch64.exe
          ./pac-test.exe
          curl -LO https://martin.st/temp/pac-test/hello-exception-aarch64-pac-15.exe
          ./hello-exception-aarch64-pac-15.exe
          curl -LO https://martin.st/temp/pac-test/hello-exception-aarch64-pac-16.exe
          ./hello-exception-aarch64-pac-16.exe
          curl -LO https://martin.st/temp/pac-test/hello-exception-aarch64-pac-18.exe
          ./hello-exception-aarch64-pac-18.exe
          curl -LO https://martin.st/temp/pac-test/hello-exception-aarch64-pac-19.exe
          ./hello-exception-aarch64-pac-19.exe
          curl -LO https://martin.st/temp/pac-test/pac-test2.exe
          ./pac-test2.exe
