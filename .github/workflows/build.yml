name: Builds
on:
  push:
    branches:
      - '**'

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{matrix.image}}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Try compiling for 32 bit
        run: |
            sudo apt-get update && sudo apt-get install gcc-multilib
            gcc -v hello.c -o hello -m32
            ./hello
