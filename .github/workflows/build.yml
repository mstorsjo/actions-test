name: Run tests with MSVC

on:
  push:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bits:
          - 32
          - 64
    steps:
      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install meson nasm gcc-multilib
      - uses: actions/checkout@v6
      - name: Build and test
        run: |
          mkdir build
          cd build
          meson setup --buildtype release --werror ${{matrix.bits == 32 && '--cross-file=../crossfiles/i686-linux32.meson' || ''}} ..
          ninja
          meson test -v
