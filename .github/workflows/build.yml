name: Builds
on:
  push:
    branches:
      - '**'

jobs:
  inspect-ubuntu:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Inspect
        run: |
          sudo apt-get update && sudo apt-get install -y wine64
          curl -LO https://martin.st/temp/hello-aarch64.exe
          curl -LO https://martin.st/temp/hello-exception-aarch64.exe
          wine hello-aarch64.exe
          wine hello-exception-aarch64.exe

  inspect-container:
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/mstorsjo/wine
    steps:
      - name: Inspect
        run: |
          curl -LO https://martin.st/temp/hello-aarch64.exe
          curl -LO https://martin.st/temp/hello-exception-aarch64.exe
          wine hello-aarch64.exe
          wine hello-exception-aarch64.exe
