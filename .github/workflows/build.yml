name: Run tests on macOS

on:
  push:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel
          - macos-14
    runs-on: ${{matrix.runner}}
    steps:
      - name: Check sysctl
        run: |
          sysctl -a
      - name: Install prerequisites
        run: |
          brew install meson nasm
      - uses: actions/checkout@v4
      - name: Build and run all tests
        run: |
          mkdir build
          cd build
          meson setup ..
          ninja
          meson test -v

